# Test PR Review Bot Configuration with Dummy LLM

repositories:
  # Bitbucket repository configuration (for testing only)
  - type: bitbucket
    username: test_user
    app_password: test_password
    workspace: test_workspace
    repo_slug: test_repo
    url: https://api.bitbucket.org/2.0
    max_prs: 1
    pr_state: OPEN
    pr_sort: created_on

# LLM Configuration with Dummy LLM
llm:
  model_name: dummy
  dummy_response: |
    ## Test Code Review Response
    
    This is a test response from the dummy LLM for testing the PR Review Bot.
    
    - **Point 1**: This is a test point
    - **Point 2**: This is another test point
    
    No actual code analysis is performed with the dummy LLM.

# Comment template
comment_template: |
  ### 🤖 LLM Code Review (TEST MODE)
  
  {remarks}
  
  _This is a test comment - no actual code review was performed._